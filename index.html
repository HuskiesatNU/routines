<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routines</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Routines">
<meta name="theme-color" content="#FFFFFF">
<style>
:root{
  --paper:#EEF1F5; --white:#FFFFFF; --ink:#1B2233; --ink-soft:#66708A; --line:#DDE2EA;
  --morning:#E39B2C; --morning-soft:#FBEBD0; --morning-ink:#8A5A0E;
  --dusk:#222A4A; --dusk-ink:#EEF0F8; --dusk-soft:#A2A9CC; --dusk-line:#38416A;
  --evening:#93A4FF; --miss:#C9CFDA; --warn:#B93B26; --warn-soft:#F6D9D3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"SF Pro Text","Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%;line-height:1.35}
body{min-height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--morning);outline-offset:2px}
input{font:inherit;color:inherit}
h1{margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:15px;font-weight:600}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto}
.loading{padding:24px 16px;color:var(--ink-soft)}
.view{padding:22px 16px 16px}
.lede{margin:0 0 18px;font-size:15px;color:var(--ink-soft)}
.quiet{color:var(--ink-soft)}
.note{margin:10px 0 0;font-size:14px;color:var(--ink-soft)}

/* Now view */
.now{padding:14px 16px 24px;min-height:calc(100dvh - 72px);--fg:var(--ink);--fg-soft:var(--ink-soft);--rule:var(--line);--accent:var(--morning);--accent-fg:var(--ink);--field:var(--white)}
.now.morning{background:var(--white)}
.now.evening{background:var(--dusk);--fg:var(--dusk-ink);--fg-soft:var(--dusk-soft);--rule:var(--dusk-line);--accent:var(--evening);--accent-fg:var(--dusk);--field:var(--dusk)}
.now{color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:20px;padding:3px;margin-bottom:12px}
.seg button{height:32px;padding:0 16px;border-radius:16px;font-size:14px;color:var(--fg-soft)}
.seg button.on{background:var(--fg);color:var(--field);font-weight:600}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.mchip{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--rule);font-size:13px;color:var(--fg-soft)}
.mchip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.hero{margin-bottom:16px}
.nowclock{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.planline{font-size:15px;color:var(--fg-soft);margin-top:6px}
.drift{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:18px}
.drift strong{font-size:17px}
.drift span{font-size:14px;color:var(--fg-soft);text-align:right}
.drift.behind strong{color:var(--warn)}
.evening .drift.behind strong{color:#FF9E8A}
.cur-label{font-size:13px;color:var(--fg-soft);margin-bottom:2px}
.cur-name{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:10px}
.cur-sub{font-size:14px;color:var(--fg-soft);margin:-4px 0 12px}
.cur-time{font-size:16px;font-variant-numeric:tabular-nums;color:var(--fg-soft)}
.cur-time span{color:var(--fg);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--rule);margin:8px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s linear}
.bar i.over{background:var(--warn)}
.evening .bar i.over{background:#FF9E8A}
.cur-target{font-size:14px;color:var(--fg-soft)}
.check{list-style:none;margin:14px 0 0;padding:0}
.check li.hd{font-size:12px;font-weight:600;color:var(--fg-soft);padding:14px 0 4px}
.check li.hd:first-child{padding-top:4px}
.ck{display:flex;gap:12px;align-items:center;width:100%;min-height:44px;padding:4px 0;border-bottom:1px solid var(--rule);font-size:15px;color:var(--fg)}
.ck::before{content:"";width:20px;height:20px;border-radius:6px;border:1.5px solid var(--fg-soft);flex:none;transition:background .12s,border-color .12s}
.ck.on{color:var(--fg-soft)}
.ck.on::before{background:var(--accent);border-color:var(--accent)}
.listbox{display:block;width:100%;min-height:120px;margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--white);font:14px/1.5 inherit;color:var(--ink);resize:vertical}
.actions{display:flex;gap:10px;margin:18px 0 26px}
.big{flex:1;height:54px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-size:18px;font-weight:700;text-align:center}
.big:active{filter:brightness(.92)}
.ghost{height:54px;padding:0 20px;border-radius:12px;border:1px solid var(--rule);font-size:16px;text-align:center;color:var(--fg-soft)}
.sub{font-size:13px;font-weight:600;color:var(--fg-soft);margin:0 0 2px}
.plan{list-style:none;margin:0 0 22px;padding:0}
.plan li{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule);font-size:16px}
.plan li:last-child{border-bottom:0}
.plan .t{width:72px;flex:none;color:var(--fg-soft);font-variant-numeric:tabular-nums;font-size:14px}
.plan .n{flex:1;min-width:0}
.plan .d{flex:none;color:var(--fg-soft);font-size:14px;font-variant-numeric:tabular-nums}
.plan .d.over{color:var(--warn);font-weight:600}
.evening .plan .d.over{color:#FF9E8A}
.plan li.skip .n{color:var(--fg-soft);text-decoration:line-through}
.finished{padding:16px 0 18px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:18px}
.fin-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
.finished p{margin:6px 0 0;font-size:15px;color:var(--fg-soft)}
.actions-quiet{display:flex;gap:22px;margin-top:6px}
.actions-quiet button{font-size:14px;color:var(--fg-soft);text-decoration:underline;text-underline-offset:3px}

/* Chores */
.chores{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.chore{border-bottom:1px solid var(--line)}
.c-line{display:flex;align-items:center;gap:10px;min-height:62px;padding:8px 0}
.c-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.c-name{font-size:16px}
.c-meta{font-size:12px;color:var(--ink-soft)}
.badge{flex:none;font-size:12px;padding:3px 8px;border-radius:10px;background:var(--paper);color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.due{background:var(--morning-soft);color:var(--morning-ink)}
.badge.late{background:var(--warn-soft);color:var(--warn);font-weight:600}
.c-done{flex:none;width:40px;height:40px;border-radius:20px;border:1.5px solid var(--line);text-align:center;font-size:18px;color:var(--ink-soft)}
.c-done:active{background:var(--morning);border-color:var(--morning);color:var(--ink)}
.c-edit{padding:2px 0 14px}
.rv-line{margin:10px 0 14px;font-size:15px}
.blockrun{--fg:var(--ink);--fg-soft:var(--ink-soft);--rule:var(--line);--accent:var(--morning);--accent-fg:var(--ink);color:var(--ink);padding:14px 0 6px;margin-top:6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.blockrun .cur-name{font-size:24px}
.blockrun .actions{margin:14px 0 14px}

/* Review */
.rv-sec{margin-bottom:30px}
.rv-sec h2{margin-bottom:10px;font-size:17px}
.g-head .cells span{text-align:center;font-size:11px;color:var(--ink-soft)}
.g-head .cells span.today{color:var(--ink);font-weight:700}
.cells{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;max-width:360px}
.g-head .cells{margin-bottom:4px}
.cell{aspect-ratio:1;border-radius:3px;background:var(--miss)}
.cell.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cell.todo{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-soft)}
.cell.away{background:transparent;box-shadow:inset 0 0 0 1px var(--line);opacity:.4}
.cell.done.morning{background:var(--morning)}
.cell.done.evening{background:var(--evening)}
.cell.late{background:var(--warn)}
table.rv{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:6px}
.rv th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.rv td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.rv th.num,.rv td.num{text-align:right;width:58px;font-variant-numeric:tabular-nums}
.rv td.over{color:var(--warn);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px}
.flags{margin-top:16px}
.flags h2{margin-bottom:6px;font-size:15px}
.flags p{margin:0 0 8px;font-size:15px}

/* Edit */
.e-sec{margin-bottom:30px}
.e-sec h2{margin-bottom:10px;font-size:17px}
.e-row{padding:10px 0;border-bottom:1px solid var(--line)}
.e-line{display:flex;align-items:center;gap:8px}
.e-line + .e-line{margin-top:6px}
.chips{flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--white);font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.fields{gap:14px;flex-wrap:wrap;margin-bottom:14px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft)}
.fields input{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--white);font-size:16px;color:var(--ink)}
.fields input[type=number]{width:84px}
.e-name{flex:1;min-width:0;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--white)}
.e-min{width:58px;height:40px;padding:0 8px;text-align:right;border:1px solid var(--line);border-radius:8px;background:var(--white);flex:none}
.unit{font-size:12px;color:var(--ink-soft);flex:none}
.icon{width:40px;height:40px;border-radius:8px;text-align:center;font-size:20px;color:var(--ink-soft);flex:none}
.icon:not(:disabled):active{background:var(--line)}
.confirm{height:40px;padding:0 12px;border-radius:8px;background:var(--warn);color:var(--white);font-size:14px;font-weight:600;flex:none}
.spacer{flex:1}
.add{display:flex;gap:8px;margin-top:12px}
.btn{height:40px;padding:0 14px;border-radius:8px;background:var(--ink);color:var(--white);font-weight:600;flex:none}
.total{margin:10px 0 0;font-size:14px;color:var(--ink-soft)}
.danger{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.danger button{color:var(--warn);font-size:15px}
.e-status{margin-top:18px;font-size:13px;color:var(--ink-soft)}
.data{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.data h2{margin-bottom:6px}
.io{display:block;width:100%;min-height:130px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--white);font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);resize:vertical}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;height:56px;text-align:center;font-size:14px;color:var(--ink-soft);position:relative}
.tabs button.active{color:var(--ink);font-weight:600}
.tabs button.active::after{content:"";position:absolute;left:28%;right:28%;top:0;height:2px;background:var(--ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="loading">Loading…</div>
  <div id="view-now" class="now hidden"></div>
  <div id="view-chores" class="view hidden"></div>
  <div id="view-review" class="view hidden"></div>
  <div id="view-edit" class="view hidden"></div>
</div>
<nav class="tabs">
  <button data-view="now" class="active">Now</button>
  <button data-view="chores">Chores</button>
  <button data-view="review">Review</button>
  <button data-view="edit">Edit</button>
</nav>

<script>
(function(){
var KEY='routine-schedule-v2';
var SECS=['morning','evening'], LABEL={morning:'Morning',evening:'Evening'};
var ATYPE={start:'Starts at',end:'Ends by',relative:'When I press start'};
var MODES={normal:'Normal',short:'Short evening',away:'Away'};
var DAY=86400000;

var state=null, view='now', sec=defaultSec(), persist=true, saveTimer=null, armed=null, armTimer=null, statusText='', openChore=null, openList=null;
function $(id){return document.getElementById(id)}

/* helpers */
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return ymd(new Date())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/DAY)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hm(str){var p=String(str).split(':').map(Number);return (p[0]||0)*60+(p[1]||0)}
function clock(m){m=Math.round(m);m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mi=m%60;return (((h+11)%12)+1)+':'+pad(mi)+(h<12?' am':' pm')}
function dur(m){m=Math.round(+m||0);if(m<60)return m+' min';var h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'')}
function mmss(m){var s=Math.max(0,Math.round(m*60));return Math.floor(s/60)+':'+pad(s%60)}
function pct(el,min){return Math.min(100,Math.max(0,min?el/min*100:100))}
function minsOf(ts,s){var d=new Date(ts),m=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;if(s==='evening'&&d.getHours()<4)m+=1440;return m}
function dayKey(ts,s){var d=new Date(ts);if(s==='evening'&&d.getHours()<4)d.setDate(d.getDate()-1);return ymd(d)}
function nowKey(s){return dayKey(Date.now(),s)}
function defaultSec(){return new Date().getHours()<15?'morning':'evening'}
function sum(steps){return steps.reduce(function(a,s){return a+(+s.min||0)},0)}
function median(a){if(!a.length)return null;var b=a.slice().sort(function(x,y){return x-y}),k=b.length>>1;return b.length%2?b[k]:(b[k-1]+b[k])/2}
function clamp(v,lo,hi,dflt){v=+v;if(isNaN(v))return dflt;return Math.min(hi,Math.max(lo,Math.round(v)))}
function plural(n,w){return n+' '+w+(n===1?'':'s')}

/* state */
var TAGS={'':'Everything',grooming:'Grooming',home:'Home'};
function ch(name,every,win,min,tag,must){return {id:uid(),name:name,every:every,win:win,min:min,tag:tag||'',must:!!must,history:[]}}
function seedState(){
  return {v:4,created:todayStr(),routines:{
    morning:{anchor:'08:15',anchorType:'end',slack:5,days:[1,2,3,4,5],steps:[
      {id:uid(),name:'Wake: dog out, water, clothes to hamper, start coffee',min:5},
      {id:uid(),name:'Fuel and gear: feed the dog, coffee, carbs, gear',min:10},
      {id:uid(),name:'Dog walk: easy, doubles as your warm-up',min:15},
      {id:uid(),name:'Run',min:60},
      {id:uid(),name:'Post-run: shirt off, hydrate, eat, log run',min:15},
      {id:uid(),name:'Posture (dumbbells on easy days)',min:10},
      {id:uid(),name:'Shower: PanOxyl first, then the rest',min:10},
      {id:uid(),name:'Shave: two-pass on weekdays',min:10},
      {id:uid(),name:'Face: splash, CeraVe AM SPF 30',min:2},
      {id:uid(),name:'Teeth',min:3},
      {id:uid(),name:'Dress',min:5},
      {id:uid(),name:'Breakfast',min:15}]},
    evening:{anchor:'19:15',anchorType:'start',slack:10,days:[0,1,2,3,4,5,6],steps:[
      {id:uid(),name:'Kitchen reset',min:10},
      {id:uid(),name:'Chores',min:15,slot:'chore'},
      {id:uid(),name:'Korean, block 1: new material, the hard part',min:45},
      {id:uid(),name:'Break: stand up, water, no phone',min:5},
      {id:uid(),name:'Korean, block 2: review, listening, reading',min:40},
      {id:uid(),name:'Tomorrow: weather, run gear, outfit, kitchen',min:10,core:true,list:[
        '# Weather and plan',
        'Low at 6:30 am tomorrow: decides run layers',
        'High tomorrow: decides work layers',
        'Rain 6 to 9 am or 5 to 7 pm: umbrella or shell by the door',
        'Set tomorrow\u2019s run minutes in Edit',
        'Notepad: anything captured today into tomorrow\u2019s plan',
        '# Run gear, by the door',
        'Shoes and socks',
        'Shorts, or tights below about 45\u00b0F',
        'Shirt: short sleeve, long sleeve below about 55\u00b0F',
        'Vest or jacket below about 45\u00b0F; hat and gloves below 40\u00b0F',
        'Headlamp or reflective layer if it\u2019s dark at 6:05',
        'Watch charged',
        'Headphones charged',
        'Fuel and anti-chafe if long or hard day',
        '# Outfit, on the hook',
        'Undershirt',
        'Shirt',
        'Trousers and belt',
        'Sweater or blazer per the high',
        'Socks and shoes',
        'Coat if needed',
        'Bag: laptop, charger, notepad, badge, keys, wallet, train pass',
        '# Kitchen and bedside',
        'Water bottle filled, by the bed',
        'Coffee loaded, mug out',
        'Breakfast set out or decided']},
      {id:uid(),name:'Face: cleanse, CeraVe PM',min:3,core:true},
      {id:uid(),name:'Teeth and floss',min:5,core:true},
      {id:uid(),name:'Wind down: dog out, phone on charger outside bedroom, alarm set',min:30,end:true}]}
  },chores:[
    ch('Change razor blade',4,3,1,'grooming'),
    ch('Trim nails',7,3,5,'grooming'),
    ch('Trim hair between cuts',7,3,10,'grooming'),
    ch('Nose and ear hair',7,3,3,'grooming'),
    ch('Launder sheets, towels, face towel',7,3,20,'home'),
    ch('Trim body hair',17,4,15,'grooming'),
    ch('Tidy eyebrows',17,4,5,'grooming'),
    ch('Haircut',30,7,60,''),
    ch('Deep clean razor',30,7,15,'grooming'),
    ch('Change toothbrush head',90,14,1,'grooming'),
    ch('Shave brush deep clean',30,7,5,'grooming'),
    ch('Shoe polish and condition',30,7,15,'home'),
    ch('Dry cleaning drop or pickup',14,4,10,'home'),
    ch('Running shoe mileage check',30,7,2,'home'),
    ch('Restock gels and electrolytes',30,7,5,'home'),
    ch('Phone and laptop backup',30,7,5,'home'),
    ch('Book dentist',180,30,5,'home')
  ],dayModes:{},runs:{}};
}
function normalize(){
  if(!state.routines||typeof state.routines!=='object')state.routines={};
  SECS.forEach(function(s){
    var r=state.routines[s]||(state.routines[s]={});
    if(!Array.isArray(r.steps))r.steps=[];
    if(!/^\d{1,2}:\d{2}$/.test(r.anchor||''))r.anchor=s==='morning'?'06:00':'22:00';
    if(!ATYPE[r.anchorType])r.anchorType=s==='morning'?'start':'end';
    if(typeof r.slack!=='number')r.slack=10;
    if(!Array.isArray(r.days))r.days=[0,1,2,3,4,5,6];r.days=r.days.map(Number).filter(function(d){return d>=0&&d<=6});
    r.steps.forEach(function(st){if(!st.id)st.id=uid();st.min=clamp(st.min,1,600,10);if(!st.name)st.name='Step';st.core=!!st.core;st.end=!!st.end;if(st.slot!=='chore')delete st.slot;if(!Array.isArray(st.list))delete st.list;else st.list=st.list.map(function(x){return String(x).trim()}).filter(Boolean).slice(0,60)});
  });
  if(!Array.isArray(state.chores))state.chores=[];
  state.chores.forEach(function(c){if(!c.id)c.id=uid();if(!c.name)c.name='Chore';if(c.every!=null)c.every=clamp(c.every,1,365,7);else c.every=null;if(c.win!=null)c.win=clamp(c.win,0,365,3);else c.win=null;c.min=clamp(c.min,1,600,10);c.must=!!c.must;if(!(c.tag in TAGS))c.tag='';if(!Array.isArray(c.history))c.history=[]});

function R(s){return state.routines[s]}

function finishPoint(p){var n=p.steps.length;return (n&&p.steps[n-1].end)?p.starts[n-1]:p.end}

/* chores */

function choreMeta(c){return c.every==null?'Set an interval to start the clock':'every '+plural(c.every,'day')+', '+c.min+' min'+(c.tag?', '+c.tag:'')+(c.must?', must':'')}

/* storage: Claude artifact storage when hosted there, the phone's own localStorage otherwise */

async function load(){

    else if(st.end)rows.push('<li><span class="t">'+clock(minsOf(e.at,s))+'</span><span class="n">'+esc(name)+'</span><span class="d">night ended</span></li>');
    else{var took=(e.at-prev)/60000;rows.push('<li><span class="t">'+clock(minsOf(e.at,s))+'</span><span class="n">'+esc(name)+'</span><span class="d'+(took>st.min+1?' over':'')+'">'+Math.round(took)+' of '+st.min+' min</span></li>')}

function checkList(st){

function renderNow(){

  }else title=esc(st.name);

    :(!isSlot||pickMin)?'<div class="actions"><button class="big" data-done>Done</button><button class="ghost" data-skip>Skip</button></div>'

  }else{

  }

  html+='<div class="actions-quiet"><button data-undo>'+undoLabel+'</button>'+(isSlot&&pickMin?'<button data-endslot>End slot now</button>':'')+'</div>';
  el.innerHTML=html;

function tick(){
  if(!state)return;
  if(view==='chores'){
    var bk=state.block;if(!bk)return;
    var bel=(Date.now()-bk.startedAt)/60000,brem=Math.max(0,bk.min-bel);
    var be=$('blockel');if(be)be.textContent=mmss(bel);
    var bb=$('blockbar');if(bb){bb.style.width=pct(bel,bk.min)+'%';bb.classList.toggle('over',bel>bk.min)}
    var bl=$('blockleft');if(bl)bl.textContent=Math.floor(brem);
    var br=$('blockrun'),bpm=br?+br.dataset.pickmin:0;
    if(bpm&&bpm>brem)renderChores();
    else if(!bpm&&brem<=0&&br&&br.querySelector('.cur-name').textContent==='Nothing due')renderChores();
    return;
  }
  if(view!=='now')return;
  var nc=$('nowclock');if(nc)nc.textContent=clock(minsOf(Date.now(),sec));
  var run=todayRun(sec);if(!run||run.finishedAt)return;
  var day=nowKey(sec);if((mode(day)==='away'&&sec==='morning')||!runsOn(sec,day))return;
  var i=curIndex(sec,run,day);if(i<0)return;
  var r=R(sec),p=planned(sec,run,day),st=p.steps[i],el=(Date.now()-lastTs(run))/60000,nowM=minsOf(Date.now(),sec);
  var e=$('elapsed');if(e)e.textContent=mmss(el);
  var b=$('bar');if(b){b.style.width=pct(el,st.min)+'%';b.classList.toggle('over',el>st.min)}
  var d=$('drift');if(d){var dr=driftHtml(nowM-p.starts[i],r.slack,p);d.className='drift'+dr.cls;d.innerHTML=dr.html}
  if(st.slot==='chore'){
    var rem=Math.max(0,st.min-el),sl=$('slotleft');if(sl)sl.textContent=Math.floor(rem);
    var cur=$('cur'),pm=cur?+cur.dataset.pickmin:0;
    if(pm&&pm>rem)renderNow();
    else if(!pm&&rem<=0&&cur&&cur.querySelector('.cur-name').textContent==='Nothing due')renderNow();
  }
}
function mark(skip){
  var run=todayRun(sec);if(!run)return;
  var day=nowKey(sec),steps=stepsFor(sec,day),i=curIndex(sec,run,day);if(i<0)return;
  var st=steps[i],now=Date.now();
  if(st.slot==='chore'){
    var slot=(run.slot&&run.slot.stepId===st.id)?run.slot:(run.slot={stepId:st.id,chores:[],skipped:[]});
    var began=lastTs(run),rem=Math.max(0,st.min-(now-began)/60000),pick=pickChore(rem,day,slotExcl(slot));
    if(pick){
      if(skip)slot.skipped.push(pick.id);
      else{choreDone(pick.id,day);slot.chores.push({id:pick.id,name:pick.name,date:day,at:now})}
      rem=Math.max(0,st.min-(Date.now()-began)/60000);
      if(pickChore(rem,day,slotExcl(slot))){save();renderNow();return}
    }
    run.steps[st.id]={at:Date.now(),skipped:false,chores:slot.chores};delete run.slot;
  }else run.steps[st.id]={at:now,skipped:!!skip};
  if(curIndex(sec,run,day)<0)run.finishedAt=Date.now();
  save();renderNow();
}
function endSlot(){
  var run=todayRun(sec);if(!run)return;
  var day=nowKey(sec),steps=stepsFor(sec,day),i=curIndex(sec,run,day);if(i<0)return;
  var st=steps[i];if(st.slot!=='chore')return;
  var slot=(run.slot&&run.slot.stepId===st.id)?run.slot:{chores:[]};
  run.steps[st.id]={at:Date.now(),skipped:false,chores:slot.chores};delete run.slot;

  save();renderNow();
}
function undo(){
  var run=todayRun(sec);if(!run)return;
  if(run.slot&&run.slot.chores.length){var c=run.slot.chores.pop();choreUndo(c.id,c.date);save();renderNow();return}
  if(run.slot&&run.slot.skipped.length){run.slot.skipped.pop();save();renderNow();return}
  var day=nowKey(sec),steps=stepsFor(sec,day),last=null;
  for(var i=steps.length-1;i>=0;i--)if(run.steps[steps[i].id]){last=steps[i].id;break}

    var e=run.steps[last];delete run.steps[last];delete run.finishedAt;delete run.slot;
    if(Array.isArray(e.chores)&&e.chores.length)run.slot={stepId:last,chores:e.chores,skipped:[]};

}

function blockExcl(b){return b.chores.map(function(c){return c.id}).concat(b.skipped)}

function blockMark(skip){

/* Review */
function stepDurations(s,st,days){
  var took=[],sk=0;
  days.forEach(function(d){
    var run=state.runs[d]&&state.runs[d][s];if(!run)return;
    var e=run.steps[st.id];if(!e)return;
    if(e.skipped){sk++;return}
    var prev=run.startedAt;
    Object.keys(run.steps).forEach(function(id){var e2=run.steps[id];if(id!==st.id&&e2&&e2.at<e.at&&e2.at>prev)prev=e2.at});
    took.push((e.at-prev)/60000);
  });
  return {took:took,skipped:sk};
}
function renderReview(){
  var el=$('view-review'),t=todayStr(),days=[],i;
  for(i=13;i>=0;i--)days.push(shift(t,-i));
  var html='<h1>Review</h1><p class="lede">The plan against what actually happened, last 14 days.</p>';
  var head='<div class="g-head"><div class="cells">'+days.map(function(d){return '<span'+(d===t?' class="today"':'')+'>'+'SMTWTFS'[parse(d).getDay()]+'</span>'}).join('')+'</div></div>';
  SECS.forEach(function(s){
    var r=R(s),steps=r.steps;if(!steps.length)return;
    var cells=[],ran=0,onPlan=0,starts=[];
    days.forEach(function(d){
      var run=state.runs[d]&&state.runs[d][s],isT=d===t;
      if(!run){cells.push('<i class="cell '+(mode(d)==='away'?'away':isT?'todo':'off')+'"></i>');return}
      var p=planned(s,run,d);
      if(r.anchorType!=='relative')starts.push(minsOf(run.startedAt,s)-p.start);
      if(!run.finishedAt){cells.push('<i class="cell '+(isT?'todo':'')+'"></i>');return}
      ran++;
      var drift=minsOf(run.finishedAt,s)-finishPoint(p);
      if(drift<=r.slack){onPlan++;cells.push('<i class="cell done '+s+'"></i>')}else cells.push('<i class="cell late"></i>');
    });
    var med=median(starts);
    html+='<div class="rv-sec"><h2>'+LABEL[s]+'</h2>'+head+'<div class="cells">'+cells.join('')+'</div>';
    html+='<p class="rv-line">'+(ran?'Finished within slack '+onPlan+' of '+plural(ran,'day')+'.':'No finished runs yet.')+(med!==null&&Math.abs(med)>=2?' Typically started '+Math.round(Math.abs(med))+' min '+(med>0?'late.':'early.'):'')+'</p>';
    var over=[];
    html+='<table class="rv"><thead><tr><th>Step</th><th class="num">Plan</th><th class="num">Typical</th><th class="num">Skipped</th></tr></thead><tbody>';
    steps.forEach(function(st){
      var d=stepDurations(s,st,days),m=st.end?null:median(d.took),hi=m!==null&&d.took.length>=3&&m>=st.min+3;
      if(hi)over.push({name:st.name,plan:st.min,typ:m});
      html+='<tr><td>'+esc(st.name)+'</td><td class="num">'+st.min+'</td><td class="num'+(hi?' over':'')+'">'+(m===null?'\u2014':Math.round(m))+'</td><td class="num">'+(d.skipped||'')+'</td></tr>';
    });
    html+='</tbody></table>';
    over.sort(function(a,b){return (b.typ-b.plan)-(a.typ-a.plan)});
    html+='<div class="flags"><h2>Where the time goes</h2>'+(over.length
      ?over.map(function(o){return '<p>'+esc(o.name)+': planned '+o.plan+' min, usually about '+Math.round(o.typ)+' (+'+Math.round(o.typ-o.plan)+').</p>'}).join('')
      :'<p class="quiet">Needs about three runs before a step counts as consistently over plan.</p>')+'</div></div>';
  });
  html+='<div class="legend"><span><i style="background:var(--morning)"></i>finished within slack</span><span><i style="background:var(--warn)"></i>finished late</span><span><i style="background:var(--miss)"></i>started, not finished</span><span><i style="box-shadow:inset 0 0 0 1px var(--line)"></i>not run</span></div>';
  var timed=state.chores.filter(function(c){return c.every!=null});
  if(timed.length){
    var span=Math.max(1,Math.min(60,daysBetween(state.created,t)+1));
    html+='<div class="rv-sec" style="margin-top:30px"><h2>Chores</h2><p class="rv-line" style="margin-top:0">Done in the last '+plural(span,'day')+' against roughly how many times the interval expected.</p>';
    html+='<table class="rv"><thead><tr><th>Chore</th><th class="num">Every</th><th class="num">Last</th><th class="num">Done</th></tr></thead><tbody>';
    sortedChores(t).forEach(function(c){
      if(c.every==null)return;
      var l=lastDone(c),n=c.history.filter(function(d){return daysBetween(d,t)<span}).length,exp=Math.max(1,Math.round(span/c.every)),low=span>=2*c.every&&n<exp*0.6;
      html+='<tr><td>'+esc(c.name)+(c.must?' <span class="c-meta">must</span>':'')+'</td><td class="num">'+c.every+'d</td><td class="num">'+(l?plural(daysBetween(l,t),'day').replace(' days','d').replace(' day','d')+' ago':'\u2014')+'</td><td class="num'+(low?' over':'')+'">'+n+' of ~'+exp+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  el.innerHTML=html;
}

function refreshTotal(s){var p=document.querySelector('p[data-total="'+s+'"]');if(p)p.textContent=totalText(s)}
function rerenderCurrent(){if(view==='edit')renderEdit();else if(view==='chores')renderChores();else if(view==='review')renderReview();else renderNow()}
function arm(key){armed=key;clearTimeout(armTimer);armTimer=setTimeout(disarm,3500);rerenderCurrent()}
function disarm(){
  if(!armed)return;var k=armed;armed=null;
  if(k.indexOf('del:')===0){var b=document.querySelector('button[data-del="'+k.slice(4)+'"]');if(b){b.className='icon';b.textContent='\u00d7';b.setAttribute('aria-label','Delete')}}

/* render + events */
function render(){
  ['now','chores','review','edit'].forEach(function(v){$('view-'+v).classList.toggle('hidden',v!==view)});
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('active',b.dataset.view===view)});

}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||!state)return;
  var ds=b.dataset,s=ds.s;
  if(ds.view){armed=null;view=ds.view;render();window.scrollTo(0,0);return}
  if(ds.sec){sec=ds.sec;renderNow();return}
  if(ds.mode){var k=nowKey(sec);if(ds.mode==='normal')delete state.dayModes[k];else state.dayModes[k]=ds.mode;save();renderNow();return}
  if(b.hasAttribute('data-ck')){b.classList.toggle('on');return}
  if(ds.listopen){openList=openList===ds.listopen?null:ds.listopen;renderEdit();return}
  if(b.hasAttribute('data-start')){ensureRun(sec);save();renderNow();return}
  if(b.hasAttribute('data-done')){mark(false);return}
  if(b.hasAttribute('data-skip')){mark(true);return}
  if(b.hasAttribute('data-undo')){undo();return}
  if(b.hasAttribute('data-endslot')){endSlot();return}
  if(b.hasAttribute('data-resetday')){dropRun(sec);save();renderNow();return}
  /* chores */
  if(b.hasAttribute('data-chore-add')){addChore();return}
  if(ds.choreOpen){openChore=openChore===ds.choreOpen?null:ds.choreOpen;renderChores();return}
  if(ds.choreDone){choreDone(ds.choreDone,todayStr());save();renderChores();return}
  if(ds.choreMust){var cm=findChore(ds.choreMust);if(cm){cm.must=!cm.must;save();renderChores()}return}
  if(ds.choreTag){var ct=findChore(ds.choreTag);if(ct){var ks=Object.keys(TAGS);ct.tag=ks[(ks.indexOf(ct.tag)+1)%ks.length];save();renderChores()}return}
  /* standalone chore block */
  if(ds.blockMin){state.blockPref.min=+ds.blockMin;save();renderChores();return}
  if(b.hasAttribute('data-block-tag')){state.blockPref.tag=ds.blockTag||'';save();renderChores();return}
  if(b.hasAttribute('data-block-start')){state.block={startedAt:Date.now(),min:state.blockPref.min,tag:state.blockPref.tag,chores:[],skipped:[]};save();renderChores();return}
  if(b.hasAttribute('data-block-done')){blockMark(false);return}
  if(b.hasAttribute('data-block-skip')){blockMark(true);return}
  if(b.hasAttribute('data-block-undo')){blockUndo();return}
  if(b.hasAttribute('data-block-end')){blockEnd();return}
  if(ds.choreDel){
    if(armed==='cdel:'+ds.choreDel){armed=null;clearTimeout(armTimer);state.chores=state.chores.filter(function(c){return c.id!==ds.choreDel});openChore=null;save();renderChores()}
    else arm('cdel:'+ds.choreDel);
    return;
  }
  /* edit */
  if(ds.atype){R(s).anchorType=ds.atype;save();renderEdit();return}
  if(ds.day!==undefined&&s){var dd=+ds.day,arr=R(s).days,ix=arr.indexOf(dd);if(ix>=0)arr.splice(ix,1);else arr.push(dd);save();renderEdit();return}
  if(ds.core){var sc=findStep(s,ds.core);if(sc){sc.core=!sc.core;save();renderEdit()}return}
  if(ds.slot){var ss=findStep(s,ds.slot);if(ss){if(ss.slot==='chore')delete ss.slot;else ss.slot='chore';save();renderEdit()}return}
  if(ds.end){var se=findStep(s,ds.end);if(se){se.end=!se.end;save();renderEdit()}return}
  if(ds.del){
    if(armed==='del:'+ds.del){armed=null;clearTimeout(armTimer);removeStep(s,ds.del);save();renderEdit()}else arm('del:'+ds.del);
    return;
  }
  if(ds.move){move(s,ds.move,+ds.dir);return}
  if(ds.add){add(ds.add);return}
  if(b.hasAttribute('data-clear')){
    if(armed==='clear'){armed=null;clearTimeout(armTimer);state.runs={};state.dayModes={};state.chores.forEach(function(c){c.history=[]});save();renderEdit()}else arm('clear');
    return;
  }
  if(b.hasAttribute('data-export')){
    var ta=$('io');ta.value=JSON.stringify(state);ta.classList.remove('hidden');$('io-actions').classList.remove('hidden');
    document.querySelector('button[data-copy]').classList.remove('hidden');document.querySelector('button[data-import]').classList.add('hidden');
    ta.focus();ta.select();setStatus('Exported '+plural(Object.keys(state.runs).length,'day')+' of history. Copy it somewhere safe.');
    return;
  }
  if(b.hasAttribute('data-import-open')){
    var ta2=$('io');ta2.value='';ta2.placeholder='Paste exported text here';ta2.classList.remove('hidden');$('io-actions').classList.remove('hidden');
    document.querySelector('button[data-copy]').classList.add('hidden');document.querySelector('button[data-import]').classList.remove('hidden');
    ta2.focus();return;
  }
  if(b.hasAttribute('data-copy')){
    var ta3=$('io'),txt=ta3.value;ta3.focus();ta3.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(err){}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){setStatus('Copied')},function(){setStatus(ok?'Copied':'Couldn\u2019t copy automatically. Select the text and copy it.')});
    else setStatus(ok?'Copied':'Couldn\u2019t copy automatically. Select the text and copy it.');
    return;
  }
  if(b.hasAttribute('data-import')){
    if(armed==='import'){
      armed=null;clearTimeout(armTimer);
      var parsed=null;try{parsed=JSON.parse($('io').value)}catch(err){}
      if(!parsed||typeof parsed!=='object'||!parsed.routines){setStatus('That text isn\u2019t an export from this app. Nothing changed.');b.textContent='Import this';return}
      state=parsed;normalize();save();renderEdit();setStatus('Imported. '+plural(Object.keys(state.runs).length,'day')+' of history restored.');
    }else{armed='import';clearTimeout(armTimer);armTimer=setTimeout(disarm,4000);b.textContent='Yes, replace everything with this'}
    return;
  }
  if(b.hasAttribute('data-reset')){
    if(armed==='reset'){armed=null;clearTimeout(armTimer);state=seedState();normalize();save();renderEdit()}else arm('reset');
  }
});
document.addEventListener('change',function(e){
  var inp=e.target;if(!state)return;
  if(inp instanceof HTMLTextAreaElement&&inp.dataset.list){
    var ls=findStep(inp.dataset.s,inp.dataset.list);if(!ls)return;
    var lines=inp.value.split('\n').map(function(x){return x.trim()}).filter(Boolean).slice(0,60);
    if(lines.length)ls.list=lines;else delete ls.list;
    save();var chip=document.querySelector('button[data-listopen="'+ls.id+'"]');if(chip){chip.textContent='Checklist'+(lines.length?' ('+lines.length+')':'');chip.classList.toggle('on',!!lines.length)}
    return;
  }
  if(!(inp instanceof HTMLInputElement))return;
  var ds=inp.dataset,s=ds.s;
  if(ds.cf){
    var c=findChore(ds.cid);if(!c)return;
    if(ds.cf==='name'){var nv=inp.value.trim();if(nv)c.name=nv;else inp.value=c.name}
    else if(ds.cf==='every'){if(inp.value.trim()==='')c.every=null;else{c.every=clamp(inp.value,1,365,c.every||7);inp.value=c.every;if(c.win==null)c.win=Math.max(1,Math.round(c.every*0.4))}}
    else if(ds.cf==='win'){if(inp.value.trim()==='')c.win=c.every==null?null:Math.max(1,Math.round(c.every*0.4));else c.win=clamp(inp.value,0,365,c.win==null?3:c.win);inp.value=c.win==null?'':c.win}
    else if(ds.cf==='min'){c.min=clamp(inp.value,1,600,c.min);inp.value=c.min}
    save();refreshChoreRow(c.id);return;
  }
  if(ds.rename){var st=findStep(s,ds.rename);if(!st)return;var v=inp.value.trim();if(v)st.name=v;else inp.value=st.name;save();return}
  if(ds.min){var st2=findStep(s,ds.min);if(!st2)return;st2.min=clamp(inp.value,1,600,st2.min);inp.value=st2.min;refreshTotal(s);save();return}
  if(ds.anchor){if(/^\d{1,2}:\d{2}$/.test(inp.value))R(ds.anchor).anchor=inp.value;else inp.value=R(ds.anchor).anchor;refreshTotal(ds.anchor);save();return}
  if(ds.slack){R(ds.slack).slack=clamp(inp.value,0,120,R(ds.slack).slack);inp.value=R(ds.slack).slack;save()}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var t=e.target;if(!(t instanceof HTMLInputElement))return;
  if(t.hasAttribute('data-chore-add-name')){e.preventDefault();addChore()}
  else if(t.dataset.addName||t.dataset.addMin){e.preventDefault();add(t.dataset.addName||t.dataset.addMin)}
  else if(t.dataset.rename||t.dataset.min||t.dataset.slack||t.dataset.cf)t.blur();
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&state)rerenderCurrent()});

load().then(function(){$('loading').classList.add('hidden');render();setInterval(tick,1000)});
})();
</script>
</body>
